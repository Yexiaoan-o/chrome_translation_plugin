<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>划词翻译助手 - 设置</title>
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
        }
        .setting-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        button {
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #3367d6;
        }
        .status-message {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            display: none;
            font-size: 13px;
        }
        .success {
            background-color: #e6f4ea;
            color: #137333;
            display: block;
        }
        .error {
            background-color: #fce8e6;
            color: #c5221f;
            display: block;
        }
        .hint {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h3>划词翻译助手设置</h3>

    <div class="setting-group">
        <label for="apiKey">OpenAI API 密钥</label>
        <input type="text" id="apiKey" placeholder="sk-...">
        <div class="hint">获取 API 密钥: <a href="https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey?apikey=%7B%7D" target="_blank">AI 账户页面</a></div>
    </div>

    <div class="setting-group">
        <label for="apiUrl">API 地址</label>
        <input type="text" id="apiUrl" placeholder="请输入 API 地址">
        <div class="hint">AI 翻译接口的 API 地址</div>
    </div>

    <div class="setting-group">
        <label for="modelName">模型名称</label>
        <input type="text" id="modelName" placeholder="请输入模型名称">
        <div class="hint">翻译使用的 AI 模型名称</div>
    </div>

    <div class="setting-group">
        <label for="customPrompt">自定义翻译提示词</label>
        <textarea id="customPrompt" placeholder="请输入翻译提示词，否则将无法正常翻译"></textarea>
        <div class="hint">提示词将作为系统消息发送给 AI 模型</div>
    </div>

    <button id="saveSettings">保存设置</button>
    <div id="statusMessage" class="status-message"></div>

    <script src="options.js"></script>
</body>
</html>
